# IB Gateway + IBC. La API solo escucha en localhost del VPS (no abrir 4002 al mundo).
# Paper: el bot usa --port 4002. Live: 4001 y TRADING_MODE=live.
name: gtaa
services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: always
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: "no"
      TWS_ACCEPT_INCOMING: accept
      # Sin esto, las ordenes API se quedan en "Enviar" y acaban Cancelled.
      BYPASS_WARNING: "yes"
      ALLOW_BLIND_TRADING: "yes"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      EXISTING_SESSION_DETECTED_ACTION: primary
      AUTO_RESTART_TIME: "11:45 PM"
      TIME_ZONE: Europe/Madrid
      TZ: Europe/Madrid
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      - "127.0.0.1:4001:4003"
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:5900:5900"
    volumes:
      - tws-settings:/home/ibgateway/tws_settings

volumes:
  tws-settings:
